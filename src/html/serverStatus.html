<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcoin Backend</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #fcfefb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .card {
        background: #ffffff;
        border-radius: 24px;
        padding: 3rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.6s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .status-icon {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto 2rem;
        margin-top: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.3s ease;
      }

      .status-icon.healthy {
        background: #f97316;
        animation: pulse 2s ease-in-out infinite;
      }

      .status-icon.error {
        background: #ef4444;
        animation: shake 0.5s ease-in-out;
      }

      .status-icon.healthy::before {
        content: "✓";
        font-size: 3.5rem;
        font-weight: bold;
        color: #ffffff;
      }

      .status-icon.error::before {
        content: "✕";
        font-size: 3.5rem;
        font-weight: bold;
        color: #ffffff;
      }

      .status-icon.healthy::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid #f97316;
        animation: ripple 2s ease-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }

      @keyframes ripple {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: #1a1a1a;
        line-height: 1.2;
      }

      .subtitle {
        font-size: 1.125rem;
        color: #6b7280;
        margin-bottom: 2.5rem;
        font-weight: 400;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.75rem 1.5rem;
        border-radius: 3rem;
        font-size: 0.9375rem;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .status-badge.healthy {
        background: rgba(249, 115, 22, 0.1);
        color: #f97316;
      }

      .status-badge.error {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
      }

      .status-badge:hover {
        transform: translateY(-2px);
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        transition: all 0.3s ease;
      }

      .status-dot.healthy {
        background: #f97316;
        animation: blink 1.5s ease-in-out infinite;
      }

      .status-dot.error {
        background: #ef4444;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(249, 115, 22, 0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.5rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .status-icon {
          width: 80px;
          height: 80px;
        }

        .status-icon::before {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-icon healthy" id="statusIcon"></div>

      <h1 id="statusTitle">Server is Awake</h1>
      <p class="subtitle" id="statusSubtitle">API services running smoothly</p>

      <div class="status-badge healthy" id="statusBadge">
        <span class="status-dot healthy" id="statusDot"></span>
        <span id="statusText">Live & Running</span>
      </div>
    </div>

    <script>
      async function checkServerHealth() {
        try {
          // Check if server is responding
          const response = await fetch("/health", {
            method: "GET",
            cache: "no-cache",
          });

          if (response.ok) {
            updateStatus("healthy");
          } else {
            updateStatus("error");
          }
        } catch (error) {
          // If health endpoint doesn't exist, assume server is healthy since this page loaded
          console.log("Health check endpoint not found, assuming healthy");
          updateStatus("healthy");
        }
      }

      function updateStatus(status) {
        const statusIcon = document.getElementById("statusIcon");
        const statusTitle = document.getElementById("statusTitle");
        const statusSubtitle = document.getElementById("statusSubtitle");
        const statusBadge = document.getElementById("statusBadge");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        if (status === "healthy") {
          statusIcon.className = "status-icon healthy";
          statusBadge.className = "status-badge healthy";
          statusDot.className = "status-dot healthy";

          statusTitle.textContent = "Server is Awake";
          statusSubtitle.textContent = "API services running smoothly";
          statusText.textContent = "Live & Running";
        } else {
          statusIcon.className = "status-icon error";
          statusBadge.className = "status-badge error";
          statusDot.className = "status-dot error";

          statusTitle.textContent = "Server Error";
          statusSubtitle.textContent = "Some services may be unavailable";
          statusText.textContent = "Issues Detected";
        }
      }

      // Check health on load
      checkServerHealth();

      // Recheck every 30 seconds
      setInterval(checkServerHealth, 30000);
    </script>
  </body>
</html>
